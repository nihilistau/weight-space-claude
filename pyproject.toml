[project]
name = "weight-space-claude"
version = "0.1.0"
description = "Reproducing 'Sparks of Weight-Space Programming' with Claude"
requires-python = "==3.11.*"
dependencies = [
    "numpy>=1.26,<3",
    "minatar==1.0.15",
]

[project.scripts]
wsp = "wsp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wsp"]

[dependency-groups]
# Experiment 8b only (`uv sync --group exp8`): checkpoint editing, GGUF conversion, grading
exp8 = [
    "torch>=2.6",
    "transformers>=5.0",
    "safetensors",
    "sentencepiece",
    "huggingface_hub",
    "requests",
    "jinja2",
    "pyyaml",
    "tqdm",
    "protobuf",
    "math-verify==0.9.0",
    "latex2sympy2_extended==1.11.0",
    "antlr4-python3-runtime==4.13.2",
]
