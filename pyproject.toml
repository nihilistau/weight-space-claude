[project]
name = "weight-space-claude"
version = "0.1.0"
description = "Reproducing 'Sparks of Weight-Space Programming' with Claude"
requires-python = "==3.11.*"
dependencies = [
    "numpy>=1.26,<3",
    "minatar==1.0.15",
]

[project.scripts]
wsp = "wsp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wsp"]
